<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1fb" />
    <meta name="color-scheme" content="light dark" />
    <title>NAMI</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-wave" viewBox="0 0 32 32">
        <path d="M5 18.5c3.2 0 3.2-5 6.4-5s3.2 5 6.4 5 3.2-5 6.4-5 3.2 5 6.4 5" />
        <path d="M5 24c3.2 0 3.2-5 6.4-5s3.2 5 6.4 5 3.2-5 6.4-5 3.2 5 6.4 5" opacity=".55" />
        <path d="M5 13c3.2 0 3.2-5 6.4-5s3.2 5 6.4 5 3.2-5 6.4-5 3.2 5 6.4 5" opacity=".3" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4.5 4.5" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3 2" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 8h9M17 8h3M4 16h3M11 16h9" />
        <circle cx="15" cy="8" r="2" />
        <circle cx="9" cy="16" r="2" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8.2 5.6a1 1 0 0 1 1.53-.85l9.1 5.9a1.5 1.5 0 0 1 0 2.7l-9.1 5.9a1 1 0 0 1-1.53-.85Z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect x="7" y="5" width="3.6" height="14" rx="1.4" fill="currentColor" stroke="none" />
        <rect x="13.4" y="5" width="3.6" height="14" rx="1.4" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="m11 6-6 6 6 6" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m7 10 5 5 5-5" />
      </symbol>
      <symbol id="i-volume" viewBox="0 0 24 24">
        <path d="M4 10v4h3l4 3.5v-11L7 10Z" />
        <path d="M15 9.2a4 4 0 0 1 0 5.6M17.6 7a7.2 7.2 0 0 1 0 10" />
      </symbol>
      <symbol id="i-mute" viewBox="0 0 24 24">
        <path d="M4 10v4h3l4 3.5v-11L7 10Z" />
        <path d="m15.5 9.5 5 5M20.5 9.5l-5 5" />
      </symbol>
      <symbol id="i-cc" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="12" rx="3" />
        <path d="M10 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />
      </symbol>
      <symbol id="i-compress" viewBox="0 0 24 24">
        <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-square" viewBox="0 0 24 24">
        <rect x="5.5" y="5.5" width="13" height="13" rx="2" />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 24 24">
        <path d="M8 8V6.5A1.5 1.5 0 0 1 9.5 5h8A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H16" />
        <rect x="5" y="8.5" width="10.5" height="10.5" rx="2" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M6 6.8c0-.7.78-1.12 1.36-.72l8 5.2a.87.87 0 0 1 0 1.44l-8 5.2A.87.87 0 0 1 6 17.2Z" />
        <path d="M18.5 6v12" />
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="M18 6.8c0-.7-.78-1.12-1.36-.72l-8 5.2a.87.87 0 0 0 0 1.44l8 5.2c.58.4 1.36-.02 1.36-.72Z" />
        <path d="M5.5 6v12" />
      </symbol>
      <symbol id="i-rewind" viewBox="0 0 24 24">
        <path d="M4 12a8 8 0 1 0 2.34-5.66" />
        <path d="M4 3.5V7h3.5" />
      </symbol>
      <symbol id="i-forward" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" />
        <path d="M20 3.5V7h-3.5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.2 4.2L19 6.8" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4.5 7h15M9 7V4.8A.8.8 0 0 1 9.8 4h4.4a.8.8 0 0 1 .8.8V7M6.5 7l.8 11.3a1.8 1.8 0 0 0 1.8 1.7h5.8a1.8 1.8 0 0 0 1.8-1.7L17.5 7" />
        <path d="M10 11v5M14 11v5" />
      </symbol>
      <symbol id="i-pip" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="14" rx="3" />
        <rect x="12.5" y="11" width="6" height="6" rx="1.5" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.8v5.4M12 16.6v.2" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="M12 3.5c.5 4.6 3.4 7.5 8 8-4.6.5-7.5 3.4-8 8-.5-4.6-3.4-7.5-8-8 4.6-.5 7.5-3.4 8-8Z" />
      </symbol>
    </svg>

    <div class="ambient" aria-hidden="true">
      <div class="ambient__image" id="ambient-a"></div>
      <div class="ambient__image" id="ambient-b"></div>
      <div class="ambient__tint"></div>
      <div class="ambient__veil"></div>
      <div class="ambient__grain"></div>
    </div>

    <div class="shell">
      <header class="titlebar" id="titlebar">
        <div class="brand">
          <span class="brand__mark"><svg class="icon" aria-hidden="true"><use href="#i-wave"></use></svg></span>
          <span class="brand__word">NAMI</span>
        </div>
        <div class="titlebar__drag"></div>
        <div class="window-controls" id="window-controls" hidden>
          <button class="window-control" type="button" data-window="minimize" aria-label="Minimize">
            <svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg>
          </button>
          <button class="window-control" type="button" data-window="maximize" aria-label="Maximize">
            <svg class="icon" aria-hidden="true"><use href="#i-square"></use></svg>
          </button>
          <button class="window-control window-control--close" type="button" data-window="close" aria-label="Close">
            <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>
      </header>

      <div class="layout">
        <nav class="rail glass" aria-label="Primary">
          <button class="rail__button is-active" type="button" data-nav="discover" aria-label="Discover" title="Discover">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <span class="rail__label" aria-hidden="true">Discover</span>
          </button>
          <button class="rail__button" type="button" data-nav="history" aria-label="History" title="History">
            <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
            <span class="rail__label" aria-hidden="true">History</span>
          </button>
          <span class="rail__spacer"></span>
          <button class="rail__button" type="button" data-nav="settings" aria-label="Settings" title="Settings">
            <svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>
            <span class="rail__label" aria-hidden="true">Settings</span>
          </button>
        </nav>

        <main class="main" id="main">
          <section class="view view--discover" id="view-discover" data-view="discover">
            <div class="view__inner">
              <header class="discover-head">
                <h1 class="display">What are you watching?</h1>
                <form class="search glass" id="search-form" role="search" autocomplete="off">
                  <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"></use></svg>
                  <input
                    class="search__input"
                    id="search-input"
                    type="search"
                    name="q"
                    placeholder="Search anime"
                    aria-label="Search anime"
                    spellcheck="false"
                    autocapitalize="off"
                  />
                  <span class="search__hint" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
                  <button class="search__clear" id="search-clear" type="button" aria-label="Clear search" hidden>
                    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
                  </button>
                </form>
                <p class="discover-sub">Search a title, pick an episode, and watch it here. Your progress stays on this machine.</p>
              </header>
              <div id="discover-body" class="discover-body"></div>
            </div>
          </section>

          <section class="view view--history" id="view-history" data-view="history" hidden>
            <div class="view__inner">
              <header class="view-head">
                <h1 class="display">History</h1>
                <p class="view-sub">Everything you have started, newest first.</p>
              </header>
              <div id="history-body" class="history-body"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="detail-layer" id="detail-layer" role="region" aria-label="Anime details" hidden></div>
    <div class="player-root" id="player-root"></div>
    <div id="dialog-root"></div>

    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

    <script src="/vendor/hls.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
